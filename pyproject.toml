[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figengine"
version = "1.1.2"
description = "High-Performance Structured Figure Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Omarjan Obulkasim @ SYSU", email = "wubulks@mail2.sysu.edu.cn" }
]

dependencies = [
  "numpy",
  "pillow",
  "matplotlib",
  "PyYAML",
  "pdf2image",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/wubulks/FigEngine"
Repository = "https://github.com/wubulks/FigEngine"
Documentation = "https://github.com/wubulks/FigEngine/blob/main/doc/FigEngine用户手册.pdf"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.6",
  "mypy>=1.8",
  "build>=1.2",
  "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["figengine*"]
exclude = ["examples*", "tests*", "docs*"]

[tool.setuptools]
include-package-data = true
