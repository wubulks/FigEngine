package:
  name: figengine
  version: "1.0.2"

source:
  path: ..

build:
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.9
    - numpy
    - pillow
    - matplotlib
    - pyyaml
    - pdf2image

test:
  imports:
    - figengine

about:
  home: https://github.com/wubulks/FigEngine
  license: MIT
  license_file: LICENSE
  summary: A High-Performance Structured Figure Engine for Python
  description: |
    FigEngine is a high-performance structured figure engine for
    scientific image processing and layout composition.
  dev_url: https://github.com/wubulks/FigEngine
  doc_url: https://github.com/wubulks/FigEngine/blob/main/doc/FigEngine用户手册.pdf

extra:
  recipe-maintainers:
    - wubulks