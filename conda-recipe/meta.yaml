package:
  name: figengine
  version: "1.2.1"

source:
  url: https://github.com/wubulks/FigEngine/releases/download/1.2.1/figengine-1.2.1.tar.gz
  sha256: e9b4259125496532e25903336431fcc3db1c7ced4d70fdd68a86c6ea19b3cc38

build:
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.9
    - numpy
    - pillow
    - matplotlib
    - pyyaml
    - pdf2image
    - typer >=0.12,<1.0
    - rich >=13,<14

test:
  imports:
    - figengine
    - figengine.feimg
    - figengine.felayout
  commands:
    - feimg --help
    - felayout --help

about:
  home: https://github.com/wubulks/FigEngine
  license: MIT
  license_file: LICENSE
  summary: A High-Performance Structured Figure Engine for Python
  description: |
    FigEngine is a high-performance structured figure engine for
    scientific image processing and layout composition.
  dev_url: https://github.com/wubulks/FigEngine
  doc_url: https://github.com/wubulks/FigEngine/blob/main/usermanuals/FigEngine_UserManual_CN.md

extra:
  recipe-maintainers:
    - wubulks
